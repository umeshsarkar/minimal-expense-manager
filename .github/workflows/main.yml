name: Build Ionic Angular App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # manual run: checks + screenshots (no APK release)

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build app
        run: npm run build

  screenshots:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Never run two screenshot commits against main at the same time.
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: npm run screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/*.png

      # Only on main: commit the images back when they changed. Pushes made
      # with GITHUB_TOKEN do not trigger new workflow runs, so this cannot loop.
      - name: Commit updated screenshots
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update app screenshots [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: List APK artifacts
        run: ls -la android/app/build/outputs/apk/release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "release-${{ github.run_number }}"
          name: "Release ${{ github.run_number }}"
          files: app-release.apk
