name: Build Ionic Angular App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # manual run: checks + screenshots (no APK release)

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build app
        run: npm run build

  screenshots:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Never run two screenshot updates against the same ref at the same time.
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: npm run screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/*.png

      # Only on main: main is protected ("changes must be made through a pull
      # request"), so changed images are proposed in a single bot PR that is
      # created or updated in place. No changes -> no PR. Requires the repo
      # setting "Allow GitHub Actions to create and approve pull requests".
      - name: Open pull request with updated screenshots
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/update-screenshots
          delete-branch: true
          add-paths: docs/screenshots/*.png
          commit-message: 'docs: update app screenshots'
          title: 'docs: update app screenshots'
          body: |
            Screenshots regenerated from `${{ github.sha }}` by the **screenshots** job
            ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            Merge to refresh the images in the README. This PR is updated automatically
            on each push to `main` while it is open.
          labels: screenshots

  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      # Don't hardcode the APK filename: read the one Gradle actually produced
      # from output-metadata.json (fall back to any *.apk in the folder).
      - name: Locate APK
        run: |
          dir=android/app/build/outputs/apk/release
          ls -la "$dir"
          apk=""
          if [ -f "$dir/output-metadata.json" ]; then
            apk="$dir/$(jq -r '.elements[0].outputFile' "$dir/output-metadata.json")"
          fi
          if [ ! -f "$apk" ]; then
            apk=$(find "$dir" -maxdepth 1 -name '*.apk' | head -n 1)
          fi
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "::error::No APK found in $dir"
            exit 1
          fi
          echo "Using $apk"
          cp "$apk" app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "release-${{ github.run_number }}"
          name: "Release ${{ github.run_number }}"
          files: app-release.apk
