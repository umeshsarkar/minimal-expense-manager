<ion-header>
  <ion-toolbar>
    <ion-title color="tertiary">Add/Remove Category</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismissModal()"><ion-icon name="close-outline"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (loc of categoryList; track loc; let i = $index) {
      <ion-item>
        {{ loc }}
        <ion-icon name="trash-outline" color="danger" slot="end" (click)="removeStoreName(i)"></ion-icon>
      </ion-item>
    }
    <ion-item>
      <ion-input placeholder="Add new store name" [(ngModel)]="newCategory"></ion-input>
      @if (isInputInvalid) {
        <ion-text color="danger" class="error-message">
          Category name exists or is empty.
        </ion-text>
      }
      <ion-icon name="add-circle-outline" slot="end" color="tertiary" (click)="addStoreName()"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
